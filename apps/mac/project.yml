# XcodeGen spec for Shades.app. Generate the project with:
#   xcodegen generate --spec apps/mac/project.yml
# The generated Shades.xcodeproj is not committed.
name: Shades
options:
  bundleIdPrefix: com.sazuyakun
  deploymentTarget:
    macOS: "15.0"
packages:
  ShadesKit:
    path: ../../packages/ShadesKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # Free distribution: ad-hoc signed, not notarized (see docs/LAUNCH.md).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Shades:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: ShadesKit
        product: ShadesKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sazuyakun.shades
        PRODUCT_NAME: Shades
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shades
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
