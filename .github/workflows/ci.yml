name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        # why: the exact SwiftFormat and SwiftLint in CLAUDE.md, not the runner image's; a newer
        # SwiftFormat on the image failed the format check on files nobody had changed.
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.1/swiftformat.zip
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -oq "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/tools"
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          brew install xcodegen

      - name: Format check
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint lint --strict

      - name: Test ShadesKit
        run: swift test --package-path packages/ShadesKit

      - name: Performance gates
        run: SHADES_PERFORMANCE=1 swift test --package-path packages/ShadesKit --filter PerformanceTests --no-parallel

      - name: Upload golden-frame mismatches
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-mismatches
          path: packages/ShadesKit/Tests/**/Golden/

      - name: Build Shades.app
        run: |
          xcodegen generate --spec apps/mac/project.yml --project apps/mac
          xcodebuild -project apps/mac/Shades.xcodeproj -scheme Shades -derivedDataPath apps/mac/.build build
