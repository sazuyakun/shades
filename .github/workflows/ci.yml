name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftformat swiftlint xcodegen

      - name: Format check
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint lint --strict

      - name: Test ShadesKit
        run: swift test --package-path packages/ShadesKit

      - name: Build the relay
        run: swift build -c release --package-path apps/mcp

      - name: Build Shades.app
        run: |
          xcodegen generate --spec apps/mac/project.yml --project apps/mac
          xcodebuild -project apps/mac/Shades.xcodeproj -scheme Shades -derivedDataPath apps/mac/.build build
