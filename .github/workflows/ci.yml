name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat and SwiftLint
        run: brew install swiftformat swiftlint

      - name: Format check
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint lint --strict --allow-zero-lintable-files

      - name: Build and test ShadesKit
        if: hashFiles('packages/ShadesKit/Package.swift') != ''
        working-directory: packages/ShadesKit
        run: swift test
